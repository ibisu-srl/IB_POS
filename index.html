<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-title" content="IBISU POS">
<meta name="application-name" content="IBISU POS">
<title>POS — IBISU SRL</title>
<!-- PWA Manifest inline como data URI -->
<link rel="manifest" href="data:application/json,{
  %22name%22:%22IBISU%20SRL%20-%20POS%22,
  %22short_name%22:%22IBISU%20POS%22,
  %22start_url%22:%22.%22,
  %22display%22:%22standalone%22,
  %22background_color%22:%22%230e0f11%22,
  %22theme_color%22:%22%23f5c842%22,
  %22icons%22:[{%22src%22:%22https://img.icons8.com/emoji/96/receipt-emoji.png%22,%22sizes%22:%2296x96%22,%22type%22:%22image/png%22}]
}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════
   RESET + VARIABLES
══════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f11;--bg2:#161719;--bg3:#1e2024;--bg4:#26292e;
  --line:#2e3138;--line2:#3a3e47;
  --txt:#e8eaf0;--txt2:#8b909e;--txt3:#555b6a;
  --acc:#f5c842;--acc2:#e8b52e;--acc-dim:rgba(245,200,66,.13);
  --red:#e05252;--red-dim:rgba(224,82,82,.13);
  --green:#4cbb8a;--green-dim:rgba(76,187,138,.13);
  --blue:#5b9cf6;--blue-dim:rgba(91,156,246,.13);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.13);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,.13);
  --r:8px;--r2:14px;--shadow:0 4px 24px rgba(0,0,0,.5);
  --nav-h:64px;   /* altura barra nav móvil */
  --top-h:56px;   /* altura topbar móvil */
}

html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);height:100%;display:flex;overflow:hidden;-webkit-tap-highlight-color:transparent}

/* Scrollbar sutil */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}

/* ══════════════════════════════════════════════════
   SIDEBAR — visible en desktop/tablet landscape
══════════════════════════════════════════════════ */
#sidebar{
  width:230px;min-width:230px;
  background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:0 0 16px;
  z-index:100;transition:transform .25s ease;
  position:relative;
}
.sidebar-brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.logo-mark{font-family:'Syne',sans-serif;font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--txt);line-height:1}
.logo-meta{font-size:10px;color:var(--txt3);font-family:'DM Mono',monospace;margin-top:5px;line-height:1.75}
.nav-section{padding:10px 12px 4px;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);font-family:'DM Mono',monospace}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:1px 8px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--txt2);transition:all .15s;user-select:none;border:1px solid transparent;-webkit-tap-highlight-color:transparent}
.nav-item:hover,.nav-item:active{background:var(--bg3);color:var(--txt)}
.nav-item.active{background:var(--acc-dim);color:var(--acc);border-color:rgba(245,200,66,.2);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.sidebar-footer{margin-top:auto;padding:12px 12px 0;border-top:1px solid var(--line)}
.time-display{font-family:'DM Mono',monospace;font-size:11px;color:var(--txt3);padding:8px}
.time-display .time{font-size:18px;color:var(--txt2);display:block;margin-bottom:1px}

/* Overlay para cerrar sidebar en tablet */
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}

/* ══════════════════════════════════════════════════
   MAIN
══════════════════════════════════════════════════ */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:0 20px;height:56px;
  border-bottom:1px solid var(--line);
  background:var(--bg);flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
#menu-toggle{
  display:none;background:none;border:none;cursor:pointer;
  color:var(--txt2);padding:6px;border-radius:var(--r);
  flex-shrink:0;
}
#menu-toggle svg{display:block}
.topbar-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;gap:7px;align-items:center;flex-shrink:0}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 22px;-webkit-overflow-scrolling:touch}

/* ══════════════════════════════════════════════════
   BOTTOM NAV — solo móvil
══════════════════════════════════════════════════ */
#bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  height:var(--nav-h);
  background:var(--bg2);border-top:1px solid var(--line);
  z-index:200;
}
.bnav-inner{display:flex;align-items:stretch;height:100%}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;color:var(--txt3);
  font-size:9.5px;font-weight:500;font-family:'DM Mono',monospace;
  letter-spacing:.04em;border:none;background:none;
  -webkit-tap-highlight-color:transparent;transition:color .15s;
  padding:6px 2px;
}
.bnav-item svg{width:20px;height:20px;opacity:.6;transition:opacity .15s}
.bnav-item.active{color:var(--acc)}
.bnav-item.active svg{opacity:1}
.bnav-item:active{background:var(--bg3)}

/* ── Botón FAB factura (central) ── */
.bnav-fab{
  flex:none;width:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  position:relative;border:none;background:none;padding:0;
}
.bnav-fab .fab-circle{
  width:46px;height:46px;border-radius:50%;
  background:var(--acc);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(245,200,66,.4);
  transition:transform .15s,box-shadow .15s;
}
.bnav-fab:active .fab-circle{transform:scale(.94);box-shadow:0 1px 6px rgba(245,200,66,.3)}
.bnav-fab .fab-circle svg{color:#0e0f11;width:20px;height:20px}
.bnav-fab .fab-label{font-size:9px;color:var(--acc);font-family:'DM Mono',monospace;margin-top:3px;font-weight:600}

/* ══════════════════════════════════════════════════
   BOTONES
══════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r);font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid transparent;transition:all .15s;user-select:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--acc);color:#0e0f11;border-color:var(--acc)}
.btn-primary:hover,.btn-primary:active{background:var(--acc2)}
.btn-ghost{background:transparent;color:var(--txt2);border-color:var(--line2)}
.btn-ghost:hover,.btn-ghost:active{background:var(--bg3);color:var(--txt)}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:rgba(224,82,82,.3)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn svg{width:13px;height:13px}

/* ══════════════════════════════════════════════════
   NCF
══════════════════════════════════════════════════ */
.ncf-pills{display:flex;gap:6px;flex-wrap:wrap}
.ncf-pill{padding:7px 12px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid var(--line2);color:var(--txt3);transition:all .15s;user-select:none;font-family:'DM Mono',monospace;background:var(--bg3);-webkit-tap-highlight-color:transparent}
.ncf-pill:active{transform:scale(.97)}
.ncf-pill.sel-B01{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.ncf-pill.sel-B02{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.ncf-pill.sel-B15{border-color:var(--orange);color:var(--orange);background:var(--orange-dim)}
.ncf-pill.sel-B14{border-color:var(--purple);color:var(--purple);background:var(--purple-dim)}
.ncf-pill.sel-FIADO{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.ncf-pill.sel-B02M{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.ncf-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:10.5px;font-family:'DM Mono',monospace;font-weight:600}
.nb-B01{background:var(--blue-dim);color:var(--blue)}.nb-B02{background:var(--green-dim);color:var(--green)}
.nb-B15{background:var(--orange-dim);color:var(--orange)}.nb-B14{background:var(--purple-dim);color:var(--purple)}
.nb-FIADO{background:var(--red-dim);color:var(--red)}
.ncf-info{background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:9px 13px;margin:8px 0;display:flex;gap:9px;align-items:flex-start}
.ncf-info .icon{font-size:17px;flex-shrink:0;margin-top:1px}
.ncf-info .desc{font-size:11px;color:var(--txt3);line-height:1.55}
.ncf-info .desc b{color:var(--txt2);display:block;margin-bottom:1px;font-size:11.5px}

/* ══════════════════════════════════════════════════
   KPI GRID
══════════════════════════════════════════════════ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:16px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),transparent);opacity:0;transition:opacity .2s}
.kpi-card:hover::before{opacity:1}
.kpi-label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);font-family:'DM Mono',monospace;margin-bottom:8px}
.kpi-value{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--txt);margin-bottom:3px}
.kpi-sub{font-size:11px;color:var(--txt3)}
.kpi-icon{position:absolute;right:12px;top:12px;opacity:.05;font-size:48px;line-height:1}

/* ══════════════════════════════════════════════════
   TABLAS
══════════════════════════════════════════════════ */
.table-wrap{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.table-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}
/* Wrapper scrollable horizontal en móvil */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:480px}
thead th{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);font-family:'DM Mono',monospace;padding:9px 16px;text-align:left;border-bottom:1px solid var(--line);background:var(--bg3);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--line);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover,tbody tr:active{background:var(--bg3)}
tbody td{padding:11px 16px;font-size:13px;color:var(--txt2)}
td.mono{font-family:'DM Mono',monospace;font-size:12px}
td.bold{color:var(--txt);font-weight:500}

/* ── Tarjetas para móvil (reemplaza tablas) ── */
.card-list{display:none;flex-direction:column;gap:10px;padding:12px}
.m-card{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:border-color .15s;-webkit-tap-highlight-color:transparent}
.m-card:active{border-color:var(--acc);background:var(--acc-dim)}
.m-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.m-card-title{font-weight:500;color:var(--txt);font-size:13.5px}
.m-card-sub{font-size:11.5px;color:var(--txt3);margin-top:2px}
.m-card-price{font-family:'DM Mono',monospace;font-size:14px;color:var(--acc);font-weight:500;text-align:right;flex-shrink:0}
.m-card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.m-card-actions{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* ══════════════════════════════════════════════════
   BADGES
══════════════════════════════════════════════════ */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500;font-family:'DM Mono',monospace}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-yellow{background:var(--acc-dim);color:var(--acc)}
.badge-blue{background:var(--blue-dim);color:var(--blue)}

/* ══════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:1000;padding:0;animation:fadeIn .15s ease}
.modal-overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg2);border:1px solid var(--line2);
  border-radius:var(--r2) var(--r2) 0 0;
  width:100%;max-width:100%;max-height:92vh;
  overflow-y:auto;animation:slideUp .2s ease;
  box-shadow:var(--shadow);
  -webkit-overflow-scrolling:touch;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-head h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:stretch;gap:8px;position:sticky;bottom:0;background:var(--bg2)}
.modal-foot .btn{flex:1;justify-content:center}
.close-btn{background:none;border:none;cursor:pointer;color:var(--txt3);padding:6px;border-radius:8px;display:flex;transition:color .15s;-webkit-tap-highlight-color:transparent}
.close-btn:hover{color:var(--txt)}

/* ══════════════════════════════════════════════════
   FORMS
══════════════════════════════════════════════════ */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);font-family:'DM Mono',monospace;margin-bottom:6px}
.form-input{
  width:100%;padding:11px 13px;
  background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);
  color:var(--txt);font-family:'DM Sans',sans-serif;font-size:16px; /* 16px evita zoom en iOS */
  transition:border-color .15s;outline:none;-webkit-appearance:none;
}
.form-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-select{
  width:100%;padding:11px 13px;
  background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);
  color:var(--txt);font-family:'DM Sans',sans-serif;font-size:16px;
  outline:none;cursor:pointer;transition:border-color .15s;-webkit-appearance:none;
}
.form-select:focus{border-color:var(--acc)}

/* ══════════════════════════════════════════════════
   FACTURACIÓN — panel dividido (desktop)
══════════════════════════════════════════════════ */
.invoice-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;height:calc(100vh - 56px - 44px)}
.invoice-panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;overflow:hidden}
.inv-head{padding:13px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.inv-body{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.inv-foot{padding:13px 14px;border-top:1px solid var(--line);flex-shrink:0}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.product-card{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:11px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.product-card:hover,.product-card:active{border-color:var(--acc);background:var(--acc-dim)}
.product-card.no-stock{opacity:.4;cursor:not-allowed}
.p-name{font-size:12.5px;font-weight:500;color:var(--txt);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-price{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--acc);font-weight:500}
.p-stock{font-size:10.5px;color:var(--txt3);margin-top:2px}

/* Carrito */
.cart-item{display:flex;align-items:center;gap:7px;padding:10px 6px;border-bottom:1px solid var(--line)}
.cart-item:last-child{border-bottom:none}
.ci-name{flex:1;font-size:12.5px;color:var(--txt);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-qty{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--line2);border-radius:6px;padding:2px;flex-shrink:0}
.ci-qty button{background:none;border:none;cursor:pointer;color:var(--txt2);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:16px;transition:all .1s;-webkit-tap-highlight-color:transparent}
.ci-qty button:hover,.ci-qty button:active{background:var(--line2);color:var(--txt)}
.ci-qty span{font-family:'DM Mono',monospace;font-size:13px;min-width:22px;text-align:center}
.ci-sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--txt2);min-width:70px;text-align:right;flex-shrink:0}
.ci-del{background:none;border:none;cursor:pointer;color:var(--txt3);padding:5px;border-radius:4px;transition:color .1s;display:flex;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.ci-del:hover,.ci-del:active{color:var(--red)}
.totals-block{border-top:1px solid var(--line);padding-top:9px;margin-bottom:11px}
.totals-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.t-label{color:var(--txt3)}.t-val{font-family:'DM Mono',monospace;color:var(--txt2)}
.totals-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
.totals-row.total .t-label{color:var(--txt);font-weight:600;font-size:14px}
.totals-row.total .t-val{color:var(--acc);font-size:17px;font-weight:500}

/* Facturación en móvil — tabs */
.invoice-tabs{display:none;border-bottom:1px solid var(--line);flex-shrink:0}
.inv-tab{flex:1;padding:12px 8px;text-align:center;font-size:12px;font-weight:500;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent}
.inv-tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.inv-tab-badge{display:inline-block;background:var(--acc);color:#0e0f11;border-radius:10px;font-size:9px;font-weight:700;padding:1px 5px;margin-left:4px;font-family:'DM Mono',monospace}

/* ══════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════ */
#toast-container{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;z-index:9999;width:calc(100% - 32px);max-width:360px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:12px 15px;font-size:13px;color:var(--txt);display:flex;align-items:center;gap:9px;animation:toastIn .2s ease;box-shadow:var(--shadow);pointer-events:auto}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.success{border-left:3px solid var(--green)}.toast.error{border-left:3px solid var(--red)}.toast.info{border-left:3px solid var(--blue)}

/* ══════════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════════ */
.search-box{position:relative;display:flex;align-items:center;width:100%}
.search-box svg{position:absolute;left:10px;width:14px;height:14px;color:var(--txt3);pointer-events:none}
.search-box input{padding:9px 12px 9px 32px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;width:100%;-webkit-appearance:none}
.search-box input:focus{border-color:var(--acc)}

/* ══════════════════════════════════════════════════
   BAR CHART
══════════════════════════════════════════════════ */
.bar-chart{padding:6px 0}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.br-label{font-size:11px;color:var(--txt2);width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.br-track{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.br-fill{height:100%;background:var(--acc);border-radius:4px;transition:width .6s ease;width:0}
.br-val{font-family:'DM Mono',monospace;font-size:10px;color:var(--txt3);min-width:30px;text-align:right;flex-shrink:0}

/* ══════════════════════════════════════════════════
   MISC
══════════════════════════════════════════════════ */
.empty-state{text-align:center;padding:50px 20px;color:var(--txt3)}
.empty-state svg{width:44px;height:44px;margin:0 auto 14px;display:block;opacity:.25}
.empty-state p{font-size:13.5px}
.divider{height:1px;background:var(--line);margin:14px 0}
.gap{height:var(--nav-h)} /* spacer debajo del contenido en móvil */

/* ══════════════════════════════════════════════════
   RESPONSIVE — TABLET (768-1023px)
══════════════════════════════════════════════════ */
@media(max-width:1023px){
  /* Sidebar se convierte en drawer deslizable */
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;
    transform:translateX(-100%);
    box-shadow:var(--shadow);
  }
  #sidebar.open{transform:translateX(0)}
  #sidebar-overlay.show{display:block}
  #menu-toggle{display:flex}

  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .invoice-layout{grid-template-columns:1fr;height:auto;gap:14px}

  /* Toast centrado */
  #toast-container{bottom:20px}
}

/* ══════════════════════════════════════════════════
   RESPONSIVE — MÓVIL (< 640px)
══════════════════════════════════════════════════ */
@media(max-width:639px){
  /* Ocultar sidebar, mostrar bottom nav */
  #sidebar{display:none}
  #bottom-nav{display:block}
  #menu-toggle{display:none}

  .content{padding:14px 14px calc(var(--nav-h) + 14px)}
  .topbar{padding:0 14px;height:var(--top-h)}
  .topbar-title{font-size:15px}

  /* KPI en 2 columnas pequeñas */
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpi-value{font-size:18px}
  .kpi-label{font-size:9px}
  .kpi-icon{display:none}

  /* Facturas — ocultar tabla, mostrar tarjetas */
  .table-hide-mobile{display:none}
  .card-list{display:flex}
  .table-scroll{display:none}

  /* Facturación en tabs */
  .invoice-layout{display:flex;flex-direction:column;height:calc(100vh - var(--top-h) - var(--nav-h));gap:0}
  .invoice-panel{border-radius:0;border-left:none;border-right:none;border-top:none}
  .invoice-tabs{display:flex}

  /* Panel tabs */
  .inv-panel-productos,.inv-panel-carrito{display:none;flex:1;overflow:hidden;flex-direction:column}
  .inv-panel-productos.tab-active,.inv-panel-carrito.tab-active{display:flex}

  /* Productos en 3 columnas en móvil */
  .product-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .p-name{font-size:11px}
  .p-price{font-size:11px}
  .p-stock{font-size:9.5px}

  /* Modal full-bottom */
  .modal{border-radius:var(--r2) var(--r2) 0 0;max-height:95vh}

  /* Form row en móvil = columna */
  .form-row{grid-template-columns:1fr}

  /* Ocultar cols en tabla cuando sí se usa */
  .hide-sm{display:none}

  /* Toast arriba en móvil */
  #toast-container{bottom:calc(var(--nav-h) + 10px)}

  /* Search full width */
  .search-box input{width:100%;font-size:16px}
}

/* ══════════════════════════════════════════════════
   RESPONSIVE — TABLET vertical (640-767px)
══════════════════════════════════════════════════ */
@media(min-width:640px) and (max-width:767px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  #bottom-nav{display:none}
}
</style>

// EMPRESA & NCF
// ═══════════════════════════════════════════════════
const EMPRESA={nombre:"IBISU SRL",rnc:"130354677",telefono:"809-570-3162",direccion:"Av. Imbert #186 Gurabito, Santiago, R.D."};
const NCF={
  B01:{codigo:"B01",nombre:"Crédito Fiscal",desc:"Para empresas/personas con RNC. Permite deducir ITBIS como crédito fiscal.",requiereRNC:true,requiereNombre:true,emoji:"🏢",seq:62},

  B13:{codigo:"B13",nombre:"Gastos Menores",desc:"Para gastos menores hasta RD$ 250,000. Sin datos del comprador.",requiereRNC:false,requiereNombre:false,emoji:"🪙",seq:13},
  B14:{codigo:"B14",nombre:"Régimen Especial",desc:"Zonas francas, diplomáticos y regímenes exentos de ITBIS.",requiereRNC:true,requiereNombre:true,emoji:"⭐",seq:4000},
  // B02M: Consumidor Final con NCF y # Factura manuales
  B02M:{codigo:"B02M",nombre:"Consumidor Final (Manual)",desc:"Igual que B02 pero el número de comprobante y de factura se ingresan manualmente.",requiereRNC:false,requiereNombre:false,emoji:"✏️",seq:2000,esManual:true},
};
function nextNCF(t){NCF[t].seq++;return`${t}${String(NCF[t].seq).padStart(8,"0")}`;}

// ═══════════════════════════════════════════════════
// GESTIÓN DE IMPRESORAS + PDF
// ═══════════════════════════════════════════════════
const PREF_KEY  = "ibisu_impresora_preferida";
const ANCHO_KEY = "ibisu_ancho_ticket";
const MODO_KEY  = "ibisu_modo_impresion"; // "impresora" | "pdf"

function getImpresoraPreferida(){ return localStorage.getItem(PREF_KEY)||""; }
function setImpresoraPreferida(n){
  localStorage.setItem(PREF_KEY,n);
  fetch("/api/impresoras/preferida",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:n})}).catch(()=>{});
}
function getAnchoTicket(){ return parseInt(localStorage.getItem(ANCHO_KEY)||"32"); }
function setAnchoTicket(a){ localStorage.setItem(ANCHO_KEY,String(a)); }
function getModoImpresion(){ return localStorage.getItem(MODO_KEY)||"impresora"; }
function setModoImpresion(m){ localStorage.setItem(MODO_KEY,m); }

// Carga impresoras del servidor o devuelve lista mínima
async function cargarImpresoras(){
  try{
    const r=await fetch("/api/impresoras");
    if(!r.ok)throw new Error();
    return (await r.json()).impresoras||[];
  }catch{
    const pref=getImpresoraPreferida();
    return pref
      ?[{nombre:pref,descripcion:pref,predeterminada:true,preferida:true}]
      :[{nombre:"Impresora predeterminada",descripcion:"Se usa la del sistema",predeterminada:true,preferida:true}];
  }
}

// ── Construcción del ticket como HTML elegante ────────────────
// ═══════════════════════════════════════════════════════════════
// TICKET PDF — GUÍA DE AJUSTES
// ═══════════════════════════════════════════════════════════════
//
// ARCHIVO: pos_gui.html  FUNCIÓN: construirTicketHTML (esta misma)
//
// ┌─────────────────────────────────────────────────────────────┐
// │  VARIABLE  │ EFECTO                    │ DÓNDE AJUSTAR      │
// ├────────────┼───────────────────────────┼────────────────────┤
// │ PDF_CFG    │ Config central de todos   │ Objeto abajo ↓     │
// │ .pageTamano│ Tamaño físico del papel   │ "58mm","80mm","carta│
// │ .pageMargen│ Margen impresión mm       │ "5mm 6mm"          │
// │ .fuente    │ Familia de fuente         │ nombre CSS         │
// │ .fuenteBase│ Tamaño base px            │ número             │
// │ .anchoBody │ Ancho del contenido       │ "52mm","74mm",etc. │
// │ .padding   │ Padding interno del ticket│ "6px 8px"          │
// │ .lineHeight│ Espaciado entre líneas    │ número decimal     │
// └─────────────────────────────────────────────────────────────┘
//
// TAMAÑOS DE PAPEL disponibles para PDF/print:
//   "58mm"     → rollo 58mm (impresora POS pequeña)
//   "80mm"     → rollo 80mm (impresora POS estándar)
//   "letter"   → carta 8.5×11" (impresora de oficina)
//   "legal"    → oficio 8.5×14"
//   "A4"       → A4 210×297mm
//
// PROBLEMA FRECUENTE — texto sale del perímetro:
//   Solución 1: Reducir .fuenteBase (ej: 9 → 8)
//   Solución 2: Reducir .anchoBody para que coincida con el papel
//   Solución 3: Aumentar .pageMargen para dar más espacio lateral
//   Solución 4: Cambiar .pageTamano a un papel más ancho
//
// PROBLEMA FRECUENTE — ticket muy pequeño en hoja carta:
//   Cambiar .pageTamano a "letter" y .anchoBody a "auto"
//   El ticket se centrará con el ancho definido en .anchoMax
//
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// CONFIGURACIÓN DE IMPRESIÓN — DOS PERFILES INDEPENDIENTES
// ═══════════════════════════════════════════════════════════════
//
// PERFIL TÉRMICA  → se usa cuando se imprime en impresora física
// PERFIL PDF      → se usa cuando se elige "Guardar PDF"
//
// ┌─────────────────────────────────────────────────────────────┐
// │ TÉRMICA                                                      │
// │  pageTamano → tamaño del rollo: "58mm" o "80mm"             │
// │  pageMargen → márgenes laterales del rollo (MUY pequeños)   │
// │  fuenteBase → tamaño base en px. 150% de 11 = ~16-17px      │
// │  logoTamano → nombre IBISU SRL                              │
// │  ncfTamano  → número NCF (se deja igual al base)            │
// │  totalTamano→ línea TOTAL en negrita                        │
// │  footerTamano→ pie "gracias por su compra"                  │
// ├─────────────────────────────────────────────────────────────┤
// │ PDF (carta / A4)                                             │
// │  pageTamano → "letter" (8.5×11") o "A4"                     │
// │  pageMargen → "0.5in" = media pulgada en todos los lados    │
// │  anchoMax   → ancho del bloque de contenido en la hoja      │
// │  fuenteBase → tamaño de letra dentro de la hoja             │
// └─────────────────────────────────────────────────────────────┘

const PDF_CFG = {

  // ══════════════════════════════════════════════════════════════
  // PERFIL IMPRESORA TÉRMICA (rollo de papel)
  // Cambios aplicados:
  //   • Márgenes laterales: 1mm exactos
  //   • Tipografía: 150% más grande (base anterior 11px → ahora 17px)
  //   • Fecha y # Ticket: NO escalan (se quedan en tamaño pequeño)
  // ══════════════════════════════════════════════════════════════
  termica: {

    // ── Papel ─────────────────────────────────────────────────
    pageTamano: "80mm",           // ← ancho del rollo

    // 0mm laterales — el margen real está en padding del #ticket
    pageMargen: "3mm 0mm",

    padding: "2px 0px",

    // ── Tipografía ─────────────────────────────────────────────
    fuenteBase:   14,
    lineHeight:   1.25,
    logoTamano:   20,
    headerSub:    12,
    ncfTamano:    12,
    totalTamano:  18,
    fechaTamano:  12,
    footerTamano: 12,
  },

  // ══════════════════════════════════════════════════════════════
  // PERFIL PDF (carta / A4)
  // Cambios aplicados:
  //   • Márgenes: exactamente 0.5 pulgada en todos los lados
  //   • Ancho: 100% del área imprimible para evitar corte lateral
  //   • Tipografía: ajustada para caber dentro del área sin desbordarse
  // ══════════════════════════════════════════════════════════════
  pdf: {

    // ── Papel ─────────────────────────────────────────────────
    // "letter" = carta 8.5×11"  |  "A4" = 210×297mm
    pageTamano: "letter",         // ← ajusta aquí si usas A4

    // Exactamente media pulgada (0.5in) en los 4 lados
    // Equivale a ~12.7mm — estándar para documentos de oficina
    pageMargen: "0.5in 0.5in",    // ← 1/2 pulgada laterales y arriba/abajo

    // "100%" = el ticket usa TODO el ancho entre márgenes
    // Esto es lo que evita el corte lateral de texto
    anchoMax: "100%",             // ← dejar en 100% para evitar corte de letras

    padding: "8px 0px",           // ← sin padding horizontal (los márgenes del @page son suficientes)

    // ── Tipografía PDF ────────────────────────────────────────
    // Ajustada para que todo el texto quepa dentro del área útil
    // Área útil en carta con 0.5in de margen ≈ 7.5 pulgadas = 540px aprox.
    fuenteBase:   13,             // ← texto general del PDF
    lineHeight:   1.55,           // ← interlineado PDF
    logoTamano:   19,             // ← "IBISU SRL" en PDF
    headerSub:    12,             // ← RNC, teléfono, dirección en PDF
    ncfTamano:    12,             // ← número NCF en PDF
    totalTamano:  17,             // ← línea TOTAL en PDF
    fechaTamano:  12,             // ← fecha y # ticket en PDF
    footerTamano: 11,             // ← pie de página en PDF
  },

};

function construirTicketHTML(factura, ancho, esModoPDF){
  // esModoPDF: true = se usa perfil PDF (carta/A4)
  //            false/undefined = se usa perfil TÉRMICA (rollo)
  const cfg = esModoPDF ? PDF_CFG.pdf : PDF_CFG.termica;
  const fmt2 = v=>"RD$ "+parseFloat(v).toLocaleString("es-DO",{minimumFractionDigits:2,maximumFractionDigits:2});
  const tiposNCF = {B01:"Crédito Fiscal",B02:"Consumidor Final",B15:"Gastos Menores",B14:"Régimen Especial"};

  // Para PDF: usar anchoMax del config. Para térmica: 100% del papel
  const anchoTicket = esModoPDF ? (cfg.anchoMax||"100%") : "100%";

  return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticket ${factura.ncf||"#"+factura.numero} — IBISU SRL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── @page: controla márgenes al imprimir / guardar PDF ────── */
/* Modo: ${esModoPDF?"PDF (carta)":"Térmica (rollo)"}           */
/* Papel: ${cfg.pageTamano}  |  Márgenes: ${cfg.pageMargen}    */
@page{
  size: ${cfg.pageTamano} auto;
  margin: ${cfg.pageMargen};
}
@page :first { margin: ${cfg.pageMargen}; }
@page :left  { margin: ${cfg.pageMargen}; }
@page :right { margin: ${cfg.pageMargen}; }

/* ── Body ──────────────────────────────────────────────────── */
body{
  font-family: 'Lucida Console', 'Consolas', 'Courier New', monospace;
  font-size: ${cfg.fuenteBase}px;
  font-weight: 500;
  line-height: ${cfg.lineHeight};
  color: #000;
  background: ${esModoPDF?"#f0f0f0":"#fff"};
  padding: ${esModoPDF?"16px":"2px 0px"};
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  -webkit-font-smoothing: antialiased;
  /* Ancho fijo en pantalla para térmica — Android lo respeta mejor */
  ${esModoPDF?"":"width:80mm;max-width:80mm;"}
}

/* ── Wrapper ─────────────────────────────────────────────────  */
#ticket{
  background: #fff;
  width: 100%;
  max-width: ${anchoTicket};
  margin: 0 auto;
  padding: ${esModoPDF?cfg.padding:"2px 0px"};
  ${esModoPDF?"border:1px solid #ddd;border-radius:4px;":""}
  word-wrap: break-word;
  overflow-wrap: break-word;
  overflow: visible;
  box-sizing: border-box;
}

/* ── Al imprimir ─────────────────────────────────────────────  */
@media print{
  #actions{
    display:none !important;
    visibility:hidden !important;
    height:0 !important;
    overflow:hidden !important;
    position:absolute !important;
  }
  html{
    margin:0 !important;
    padding:0 !important;
  }
  body{
    background:#fff !important;
    padding:0 !important;
    margin:0 !important;
    /* Ancho fijo en mm — Android Chrome lo respeta mejor que % */
    width:${esModoPDF?"auto":"80mm"} !important;
    max-width:${esModoPDF?"100%":"80mm"} !important;
    font-size:${cfg.fuenteBase}px !important;
    color:#000 !important;
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
  }
  #ticket{
    border:none !important;
    border-radius:0 !important;
    width:100% !important;
    max-width:100% !important;
    margin:0 !important;
    overflow:visible !important;
    /* padding-right protege del margen hardware de la impresora */
    padding:0 6mm 0 1mm !important;
    box-sizing:border-box !important;
    font-size:${cfg.fuenteBase}px !important;
  }
}

/* ── Separadores ─────────────────────────────────────────────  */
.sep { border:none;border-top:1px dashed #555;margin:${esModoPDF?"5px":"4px"} 0 }
.sep2{ border:none;border-top:1px solid  #000;margin:${esModoPDF?"5px":"3px"} 0 }

/* ── Encabezado ──────────────────────────────────────────────  */
.center{ text-align:center }
.logo{
  font-size: ${cfg.logoTamano}px;
  font-weight: 700;
  letter-spacing: .04em;
  margin-bottom: 2px;
}
.header-sub{
  font-size: ${cfg.headerSub}px;
  color: #000;
  line-height: 1.55;
}

/* ── Box NCF ─────────────────────────────────────────────────  */
.ncf-box{
  border:1px solid #000;
  border-radius:2px;
  padding:${esModoPDF?"5px 7px":"4px 5px 4px 5px"};
  margin:${esModoPDF?"7px":"2px"} 0;
  background:#fff;
  font-size: ${cfg.ncfTamano}px;
  word-break: break-all;
}
.ncf-tipo{
  font-weight:400;
  font-size:${cfg.ncfTamano+1}px;
  margin-bottom:1px;
}
.ncf-num{
  font-family:'Courier New',monospace;
  letter-spacing:.03em;
  color:#000;
  /* NCF y # Ticket conservan su tamaño — no escalan al 150% */
}

/* ── Datos de la factura (Factura # → TOTAL al 75% del base) ──  */
/* 75% de ${cfg.fuenteBase}px = ${Math.round(cfg.fuenteBase*0.75)}px */
.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:2px;
  margin:0;
  font-size: ${Math.round(cfg.fuenteBase*0.75)}px;
}
.row .l{ flex:1;word-break:break-word;min-width:0; }
.row .r{
  flex-shrink:0;
  text-align:right;
  overflow:visible;
  word-break:break-all;
  white-space:normal;
  /*
   * Sin padding-right aquí — el padding está en #ticket
   * para que aplique a TODO el contenido de una vez
   */
}
/* Fecha y número de ticket: tamaño fijo (no escala) */
.dato-fijo{
  font-size: ${cfg.fechaTamano}px;
  color: #000;
}
.bold{ font-weight:400 }

/* ── Productos (al 75% del base) ─────────────────────────────  */
/* 75% de ${cfg.fuenteBase}px = ${Math.round(cfg.fuenteBase*0.75)}px */
.item-wrap{ margin:${esModoPDF?"4px":"1px"} 0 }
.item-name{
  font-weight:400;
  font-size:${Math.round(cfg.fuenteBase*0.75)}px;
  word-break:break-word;
  line-height:1.2;
}
.item-det{
  display:flex;
  justify-content:space-between;
  font-size:${Math.round((cfg.fuenteBase-1)*0.75)}px;
  color:#000;
  margin-top:1px;
}
.item-det .cant{ flex:1; overflow:hidden; text-overflow:ellipsis; }
.item-det .sub{
  text-align:right;
  white-space:nowrap;
  flex-shrink:0;
  padding-right:2px;
}

/* ── Subtotales (al 75% del base) ────────────────────────────  */
.sub-row{
  display:flex;justify-content:space-between;
  font-size:${Math.round(cfg.fuenteBase*0.75)}px;
  margin:0;
}
.sub-row .l{ flex:1 }
.sub-row .r{
  text-align:right;
  white-space:nowrap;
  flex-shrink:0;
  padding-right:2px;
}

/* ── Línea TOTAL (al 75% del totalTamano) ───────────────────  */
/* 75% de ${cfg.totalTamano}px = ${Math.round(cfg.totalTamano*0.75)}px */
.total-row{
  display:flex;
  justify-content:space-between;
  font-size:${Math.round(cfg.totalTamano*0.75)}px;
  font-weight:400;
  padding:${esModoPDF?"4px 0":"2px 0"};
  border-top:2px solid #000;
  border-bottom:2px solid #000;
  margin:${esModoPDF?"3px":"2px"} 0;
}

/* ── Pie de página ───────────────────────────────────────────  */
.footer{
  text-align:center;
  font-size:${cfg.footerTamano}px;
  color:#000;
  margin-top:${esModoPDF?"10px":"4px"};
  line-height:1.7;
}

/* ── Barra de acciones (solo pantalla) ──────────────────────  */
#actions{
  display:flex;gap:8px;padding:10px;
  background:#fff;border-bottom:1px solid #ddd;
  position:sticky;top:0;z-index:10;
  max-width:${anchoTicket};margin:0 auto 10px;
  border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.1);
}
#actions button{
  flex:1;padding:9px 4px;border:none;border-radius:6px;
  font-size:13px;font-weight:600;cursor:pointer;
}
.btn-imp{background:#f5c842;color:#111}
.btn-pdf{background:#e05252;color:#fff}
.btn-close{background:#ddd;color:#333}
</style>
</head>
<body>

<!-- Barra de acciones — oculta al imprimir -->
<div id="actions">
  <button class="btn-imp" onclick="imprimirSinHeaders()">🖨 Imprimir</button>
  <button class="btn-pdf" onclick="guardarPDF()">📄 Guardar PDF</button>
  <button class="btn-close" onclick="window.close()">✕ Cerrar</button>
</div>
<!-- Ticket -->
<div id="ticket">

  <!-- Encabezado -->
  <div class="center">
    <div class="logo">IBISU SRL</div>
    <div class="header-sub">
      RNC: 130354677<br>
      ☎ 809-570-3162<br>
      Av. Imbert #186 Gurabito<br>
      Santiago, R.D.
    </div>
  </div>

  <hr class="sep2" style="margin:3px 0">

  <!-- NCF box -->
  <div class="ncf-box">
    <div class="ncf-tipo">${factura.tipoNCF||"B02"} · ${tiposNCF[factura.tipoNCF]||"Comprobante"}</div>
    <div class="ncf-num">NCF: ${factura.ncf||"-"}</div>
  </div>

  <!-- Datos — Factura # hasta TOTAL al 75% del tamaño base -->
  <div class="row">
    <span class="l bold">Factura #</span>
    <span class="r dato-fijo">${factura.numero}</span>
  </div>
  <div class="row">
    <span class="l bold">Fecha</span>
    <span class="r dato-fijo">${factura.fecha}</span>
  </div>
  <div class="row">
    <span class="l bold">Hora impr.</span>
    <span class="r dato-fijo">${new Date().toLocaleTimeString("es-DO",{hour:"2-digit",minute:"2-digit"})}</span>
  </div>
  <div class="row">
    <span class="l bold">Cliente</span>
    <span class="r">${factura.cliente||"Consumidor Final"}</span>
  </div>
  ${factura.cedula?`
  <div class="row">
    <span class="l bold">RNC/Céd.</span>
    <span class="r">${factura.cedula}</span>
  </div>`:""}
  ${factura.vendedor?`
  <div class="row">
    <span class="l bold">Vendedor</span>
    <span class="r dato-fijo">${factura.vendedor}</span>
  </div>`:""}

  <hr class="sep2" style="margin:3px 0">

  <!-- Productos -->
  ${factura.items.map(it=>`
  <div class="item-wrap">
    <div class="item-name">${it.nombre}</div>
    <div class="item-det">
      <span class="cant">${it.cantidad} x ${fmt2(it.precioBase||it.precio/1.18)}</span>
      <span class="sub">${fmt2(it.subtotal)}</span>
    </div>
  </div>`).join("")}

  <hr class="sep2" style="margin:3px 0">

  <!-- Totales -->
  <div class="sub-row"><span class="l">Subtotal</span><span class="r">${fmt2(factura.subtotal)}</span></div>
  <div class="sub-row"><span class="l">ITBIS 18%</span><span class="r">${fmt2(factura.itbis)}</span></div>
  <div class="total-row"><span>TOTAL</span><span>${fmt2(factura.total)}</span></div>

  ${esModoPDF?`
  <!-- PDF: espacio normal + dos mensajes -->
  <div style="height:20px"></div>
  <div class="footer">
    ¡Gracias por su compra!<br>
    Comprobante fiscal válido · DGII
  </div>
  `:`
  <!-- TÉRMICA: 15 líneas en blanco después de TOTAL -->
  <div style="line-height:${cfg.lineHeight};font-size:${cfg.fuenteBase}px">
    <br>
    .
    <br>
    .
    <br>
    .
    <br>
    .
    <br>
    .
    <br>
    .
    <br>
    .
    <br>
    .
    <br>
    .
    <br>
    .
  </div>
  <!-- Solo Gracias después de los espacios -->
  <div class="footer">¡Gracias por su compra!</div>
  `}
</div>

<script>
document.title = "IBISU SRL · Ticket ${factura.ncf||("#"+factura.numero)}";

function imprimirSinHeaders(){
  window.print();
}

function guardarPDF(){
  document.getElementById("actions").style.display="none";
  document.title = "Ticket_${(factura.ncf||("F"+factura.numero)).replace(/[^a-zA-Z0-9_-]/g,"_")}_IBISU";
  window.print();
  setTimeout(()=>{
    document.getElementById("actions").style.display="flex";
    document.title = "IBISU SRL · Ticket ${factura.ncf||("#"+factura.numero)}";
  },600);
}
<\/script>
</body></html>`;
}

// Abre ventana con el ticket HTML elegante
function abrirPreviewTicket(textoPlano, facturaObj, ancho, esModoPDF){
  // esModoPDF=true → perfil carta/A4  |  false → perfil térmica
  const contenido = facturaObj
    ? construirTicketHTML(facturaObj, ancho, esModoPDF)
    : `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ticket IBISU SRL</title>
       <style>
         @page{size:${esModoPDF?"letter":"80mm"};margin:${esModoPDF?"0.5in 0.5in":"3mm 0.5mm"}}
         body{font-family:'Lucida Console','Consolas','Courier New',monospace;font-weight:500;font-size:${esModoPDF?"12px":"16px"};color:#000;margin:0;background:#fff;white-space:pre}
         #actions{display:flex;gap:8px;padding:10px;background:#f5f5f5;border-bottom:1px solid #ddd;position:sticky;top:0}
         #actions button{flex:1;padding:9px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
         .btn-imp{background:#f5c842;color:#111}.btn-pdf{background:#e05252;color:#fff}.btn-cl{background:#ddd;color:#333}
         @media print{#actions{display:none!important}}
       </style></head><body>
       <div id="actions">
         <button class="btn-imp" onclick="window.print()">🖨 Imprimir</button>
         <button class="btn-pdf" onclick="document.getElementById('actions').style.display='none';window.print();setTimeout(()=>document.getElementById('actions').style.display='flex',500)">📄 Guardar PDF</button>
         <button class="btn-cl" onclick="window.close()">✕ Cerrar</button>
       </div>
       <div style="padding:${esModoPDF?"16px":"4px"}">${(textoPlano||"").replace(/</g,"&lt;")}</div>
       </body></html>`;

  // Usar Blob URL en lugar de window.open("") para que Chrome
  // NO muestre "about:blank" al imprimir — la URL del Blob es opaca
  const blob = new Blob([contenido], {type:"text/html;charset=utf-8"});
  const url  = URL.createObjectURL(blob);
  const w    = window.open(url, "_blank", "width=440,height=700");
  if(!w){
    toast("Permite ventanas emergentes para ver el ticket","info");
    URL.revokeObjectURL(url);
    return;
  }
  // Liberar el Blob después de que la ventana lo cargó
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

// Genera y abre ticket como PDF (usa perfil PDF)
function descargarPDF(factura, ancho){
  const html = construirTicketHTML(factura, ancho, true); // true = modo PDF
  const blob = new Blob([html],{type:"text/html;charset=utf-8"});
  const url  = URL.createObjectURL(blob);
  const w    = window.open(url,"_blank","width=560,height=750");
  if(!w){
    const a=document.createElement("a");
    a.href=url;
    a.download=`Ticket_${factura.ncf||"F"+factura.numero}_IBISU.html`;
    a.click();
    toast("Archivo descargado — ábrelo y usa Ctrl+P para guardar como PDF","info");
  }
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

// Ejecuta la impresión física vía servidor o muestra preview
async function ejecutarImpresion(facturaId, nombreImpresora, ancho){
  const factura = DB.facturas.find(f=>f.id===facturaId);
  const esPDF   = (nombreImpresora==="__PDF__");

  if(esPDF){
    // Modo PDF — usar perfil carta/A4
    if(factura) abrirPreviewTicket(null, factura, ancho, true);
    else toast("Factura no encontrada","error");
    return true;
  }

  try{
    const r=await fetch("/api/imprimir",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({factura_id:facturaId,impresora:nombreImpresora,ancho})
    });
    const data=await r.json();
    if(data.preview){
      // El servidor no tiene win32print — mostrar preview térmica
      abrirPreviewTicket(data.preview, factura, ancho, false);
      return true;
    }
    return data.ok;
  }catch{
    // Sin servidor — abrir preview con perfil térmica
    if(factura){ abrirPreviewTicket(null, factura, ancho, false); return true; }
    toast("Sin conexión al servidor — activa servidor.py","error");
    return false;
  }
}

// ── MODAL PRINCIPAL DE IMPRESIÓN ──────────────────────────────
async function modalImpresora(facturaId){
  const impresoras = await cargarImpresoras();
  const preferida  = getImpresoraPreferida();
  const ancho      = getAnchoTicket();
  const modo       = getModoImpresion(); // "impresora" | "pdf"

  // Construir lista: primero PDF, luego impresoras físicas
  const todasOpciones = [
    {nombre:"__PDF__", descripcion:"Guardar como PDF / Vista previa elegante",
     predeterminada:false, preferida:false, esPDF:true},
    ...impresoras
  ];

  const autoSel = modo==="pdf"
    ? 0
    : Math.max(0, todasOpciones.findIndex((_,i)=>i>0 && (todasOpciones[i].preferida||(i===1&&!preferida))));

  const opcionesHTML = todasOpciones.map((imp,i)=>{
    const seleccionado = i===autoSel;
    const esPDF = imp.esPDF;
    const color  = esPDF ? "var(--red)" : seleccionado ? "var(--acc)" : "var(--line2)";
    const bgSel  = esPDF && seleccionado ? "var(--red-dim)" : seleccionado ? "var(--acc-dim)" : "var(--bg3)";
    return `
    <div style="display:flex;align-items:center;gap:12px;padding:13px 14px;
                border:1.5px solid ${seleccionado?color:"var(--line2)"};
                border-radius:var(--r);cursor:pointer;margin-bottom:8px;
                background:${seleccionado?bgSel:"var(--bg3)"};transition:all .15s"
         id="imp-opt-${i}" onclick="selectImpresora(${i},${todasOpciones.length})">
      <input type="radio" name="imp-radio" value="${imp.nombre}" style="display:none" ${seleccionado?"checked":""}>
      <div style="width:40px;height:40px;border-radius:10px;
                  background:${esPDF?"var(--red-dim)":"var(--bg4)"};
                  border:1.5px solid ${esPDF?"rgba(224,82,82,.3)":"var(--line)"};
                  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">
        ${esPDF?"📄":"🖨"}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:${esPDF?"var(--red)":"var(--txt)"};
                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${esPDF?"PDF / Vista previa":imp.nombre}
        </div>
        <div style="font-size:11px;color:var(--txt3);margin-top:2px">${imp.descripcion}</div>
        <div style="display:flex;gap:5px;margin-top:4px;flex-wrap:wrap">
          ${esPDF?`<span class="badge" style="background:var(--red-dim);color:var(--red);font-size:9.5px">Guardar PDF</span>
                   <span class="badge" style="background:var(--blue-dim);color:var(--blue);font-size:9.5px">Vista previa</span>`:""}
          ${!esPDF&&imp.predeterminada?`<span class="badge badge-blue" style="font-size:9.5px">Del sistema</span>`:""}
          ${!esPDF&&imp.preferida?`<span class="badge badge-green" style="font-size:9.5px">★ Preferida</span>`:""}
        </div>
      </div>
      <div id="imp-check-${i}"
           style="width:22px;height:22px;border-radius:50%;flex-shrink:0;
                  border:2px solid ${seleccionado?color:"var(--line2)"};
                  display:flex;align-items:center;justify-content:center;transition:all .15s">
        ${seleccionado?`<div style="width:10px;height:10px;border-radius:50%;background:${color}"></div>`:""}
      </div>
    </div>`}).join("");

  openModal("🖨 Imprimir comprobante",`
    <!-- Opciones -->
    <div id="imp-lista" style="margin-bottom:16px">${opcionesHTML}</div>

    <!-- Ancho del ticket (solo para impresoras físicas) -->
    <div id="ancho-wrap" style="background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;${modo==='pdf'?'opacity:.5;pointer-events:none':''}">
      <div class="form-label" style="margin-bottom:10px">Tamaño de papel</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${[{a:32,l:"58 mm",s:"Impresora pequeña"},{a:42,l:"80 mm",s:"Estándar"},{a:48,l:"80 mm+",s:"Papel ancho"}]
          .map(o=>`
          <div onclick="selectAncho(${o.a})" id="ancho-${o.a}"
               style="flex:1;min-width:70px;padding:10px;text-align:center;cursor:pointer;border-radius:var(--r);
                      border:1.5px solid ${ancho===o.a?"var(--acc)":"var(--line2)"};
                      background:${ancho===o.a?"var(--acc-dim)":"var(--bg4)"};transition:all .15s">
            <div style="font-family:'DM Mono',monospace;font-size:14px;font-weight:700;
                        color:${ancho===o.a?"var(--acc)":"var(--txt)"}">${o.a}ch</div>
            <div style="font-size:11px;font-weight:600;color:${ancho===o.a?"var(--acc)":"var(--txt2)"};margin-top:1px">${o.l}</div>
            <div style="font-size:10px;color:var(--txt3)">${o.s}</div>
          </div>`).join("")}
      </div>
    </div>

    <!-- Guardar preferencia -->
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 2px">
      <input type="checkbox" id="chk-guardar" style="width:16px;height:16px;accent-color:var(--acc)" checked>
      <span style="font-size:13px;color:var(--txt2)">Recordar esta selección</span>
    </label>`,

    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" style="gap:8px" onclick="confirmarImpresion(${facturaId})">
       ${ic('<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>')} Continuar
     </button>`);

  window._impresorasModal = todasOpciones;
  window._anchoSeleccionado = ancho;
}

function selectImpresora(idx, total){
  const opts = window._impresorasModal||[];
  for(let i=0;i<total;i++){
    const el=document.getElementById(`imp-opt-${i}`);
    const chk=document.getElementById(`imp-check-${i}`);
    const esPDF = opts[i]?.esPDF;
    const sel = i===idx;
    const color = esPDF?"var(--red)":sel?"var(--acc)":"var(--line2)";
    const bgSel = esPDF&&sel?"var(--red-dim)":sel?"var(--acc-dim)":"var(--bg3)";
    if(el){ el.style.borderColor=sel?color:"var(--line2)"; el.style.background=sel?bgSel:"var(--bg3)"; }

async function dbGetFacturas(q=""){
  if(!supabaseConectado) return DB.facturas;
  try{
    let filtro = "order=id.desc";
    if(q) filtro += `&or=(cliente.ilike.*${q}*,ncf.ilike.*${q}*)`;
    const facturas = await SB.get("facturas", filtro);
    // Cargar items de cada factura
    const ids = facturas.map(f=>f.id).join(",");
    let items = [];
    if(ids){
      items = await SB.get("factura_items", `factura_id=in.(${ids})`);
    }
    DB.facturas = facturas.map(f=>({
      id:         f.id,
      numero:     f.numero,
      ncf:        f.ncf,
      tipoNCF:    f.tipo_ncf,
      cliente:    f.cliente,
      cedula:     f.cedula||"",
      fecha:      f.fecha,
      vendedor:   f.vendedor||"",
      subtotal:   parseFloat(f.subtotal),
      itbis:      parseFloat(f.itbis),
      total:      parseFloat(f.total),
      esManual:   f.es_manual,
      items: items.filter(i=>i.factura_id===f.id).map(i=>({
        codigo:     i.codigo||"",
        nombre:     i.nombre,
        precio:     parseFloat(i.precio),
        precioFinal:parseFloat(i.precio),
        precioBase: parseFloat(i.precio_base),
        cantidad:   i.cantidad,
        subtotal:   parseFloat(i.subtotal),
        esLibre:    i.es_libre
      }))
    }));
    return DB.facturas;
  }catch(e){ toast("Error cargando facturas","error"); return DB.facturas; }
}

async function dbCrearFactura(factura, items){
  if(!supabaseConectado){
    factura.id = DB.facturas.length + 1;
    DB.facturas.push(factura);
    return factura;
  }
  try{
    // 1. Insertar cabecera
    const [row] = await SB.post("facturas",{
      numero:   factura.numero,
      ncf:      factura.ncf,
      tipo_ncf: factura.tipoNCF,
      cliente:  factura.cliente,
      cedula:   factura.cedula||"",
      fecha:    factura.fecha,
      vendedor: factura.vendedor||"",
      subtotal: factura.subtotal,
      itbis:    factura.itbis,
      total:    factura.total,
      es_manual:factura.esManual||false
    });
    factura.id = row.id;

    // 2. Insertar items
    if(items.length){
      await SB.post("factura_items", items.map(i=>({
        factura_id: row.id,
        codigo:     i.codigo||"",
        nombre:     i.nombre,
        precio:     i.precioFinal||i.precio,
        precio_base:i.precioBase||(i.precio/1.18),
        cantidad:   i.cantidad,
        subtotal:   i.subtotal,
        es_libre:   i.esLibre||false
      })));
    }

    // 3. Actualizar stock en BD
    for(const it of items){
      if(it.codigo && !it.esLibre){
        const p = DB.productos.find(x=>x.codigo===it.codigo);
        if(p && p.id) await SB.patch("productos", p.id, {stock: Math.max(0, p.stock - it.cantidad)});
      }
    }

    DB.facturas.unshift(factura);
    return factura;
  }catch(e){ throw e; }
}

async function dbEliminarFactura(id){
  const idx = DB.facturas.findIndex(x=>x.id===id);
  if(idx>=0) DB.facturas.splice(idx,1);
  if(!supabaseConectado) return;
  try{ await SB.delete("facturas", id); } // CASCADE elimina los items
  catch(e){ toast("Error eliminando factura","error"); }
}

async function dbActualizarFactura(id, datos, items){
  const f = DB.facturas.find(x=>x.id===id);
  if(f) Object.assign(f, datos);
  if(!supabaseConectado) return;
  try{
    await SB.patch("facturas", id, {
      numero:   datos.numero,
      ncf:      datos.ncf,
      tipo_ncf: datos.tipoNCF,
      cliente:  datos.cliente,
      cedula:   datos.cedula||"",
      fecha:    datos.fecha,
      subtotal: datos.subtotal,
      itbis:    datos.itbis,
      total:    datos.total
    });
    // Borrar y reinsertar items
    await fetch(`${SUPABASE_URL}/rest/v1/factura_items?factura_id=eq.${id}`,
      {method:"DELETE", headers:SB.headers});
    if(items && items.length){
      await SB.post("factura_items", items.map(i=>({
        factura_id: id,
        codigo:     i.codigo||"",
        nombre:     i.nombre,
        precio:     i.precioFinal||i.precio,
        precio_base:i.precioBase||(i.precio/1.18),
        cantidad:   i.cantidad,
        subtotal:   i.subtotal,
        es_libre:   i.esLibre||false
      })));
    }
  }catch(e){ toast("Error actualizando factura","error"); }
}

// Estructura guardada en localStorage "ibisu_bloqueo":
// {
//   activo: true/false,          ← bloqueo manual inmediato
//   mensaje: "texto...",         ← mensaje que ve el vendedor
//   programado: {                ← bloqueo por fecha/hora
//     activo: true/false,
//     desde: "2026-06-20T08:00",
//     hasta: "2026-06-20T18:00"
//   }
// }

function getBloqueo(){
  try{ return JSON.parse(localStorage.getItem("ibisu_bloqueo")||"{}"); }
  catch{ return {}; }
}
function setBloqueo(obj){
  // Guardar local siempre (inmediato)
  localStorage.setItem("ibisu_bloqueo", JSON.stringify(obj));
  // Sincronizar con Supabase para que otros dispositivos lo vean
  if(supabaseConectado){
    SB.post("configuracion",[{clave:"bloqueo", valor:JSON.stringify(obj)}])
      .catch(()=>{
        // Si falla el insert, intentar update
        fetch(SUPABASE_URL+"/rest/v1/configuracion?clave=eq.bloqueo",{
          method:"PATCH",
          headers:{...SB.headers,"Prefer":"return=minimal"},
          body:JSON.stringify({valor:JSON.stringify(obj)})
        }).catch(()=>{});
      });
  }
}
async function sincronizarBloqueo(){
  // Obtener el bloqueo desde Supabase y actualizar localStorage
  if(!supabaseConectado) return;
  try{
    const rows = await SB.get("configuracion","clave=eq.bloqueo&select=valor");
    if(rows && rows.length>0 && rows[0].valor){
      const remoto = JSON.parse(rows[0].valor);
      localStorage.setItem("ibisu_bloqueo", JSON.stringify(remoto));
    }
  }catch(e){ /* sin conexión — usar localStorage */ }
}

// Devuelve true si el rol debe ser bloqueado en este momento
function estaBloquedoPara(rol){
  if(rol==="superusuario" || rol==="autorizado") return false; // nunca se bloquean
  const b = getBloqueo();
  // Bloqueo manual
  if(b.activo) return true;
  // Bloqueo programado
  if(b.programado?.activo){
    const ahora = new Date();
    const desde = b.programado.desde ? new Date(b.programado.desde) : null;
    const hasta = b.programado.hasta ? new Date(b.programado.hasta) : null;
    if(desde && hasta) return ahora >= desde && ahora <= hasta;
    if(desde && !hasta) return ahora >= desde;
    if(!desde && hasta) return ahora <= hasta;
  }
  return false;
}

function toggleBloqueoManual(){
  const b = getBloqueo();
  b.activo = !b.activo;
  setBloqueo(b);
  // Si el superusuario activa el bloqueo mientras hay vendedores logueados,
  // el efecto se verá cuando intenten hacer algo que refresque la página
  const estado = b.activo ? "activado 🔴" : "desactivado 🟢";
  // Refrescar el modal con el nuevo estado
  closeModal();
  setTimeout(()=>modalBloqueoAcceso(), 100);
  toast(`Bloqueo manual ${estado}`,"success");
}

function guardarBloqueo(){
  const b = getBloqueo();
  b.activo  = document.getElementById("blq-manual")?.checked || false;
  b.mensaje = document.getElementById("blq-msg")?.value.trim()
              || "El sistema no está disponible. Contacte al administrador.";
  const progOn = document.getElementById("blq-prog")?.checked || false;
  const desde  = document.getElementById("blq-desde")?.value  || "";
  const hasta  = document.getElementById("blq-hasta")?.value  || "";
  b.programado = { activo: progOn, desde, hasta };
  setBloqueo(b);
  closeModal();
  const resumen = b.activo
    ? "🔴 Bloqueo manual ACTIVO — vendedores bloqueados"
    : progOn
      ? `⏰ Bloqueo programado activo: ${desde||"ahora"} → ${hasta||"indefinido"}`
      : "🟢 Sistema abierto para todos";
  toast(resumen, b.activo?"error":"success");
}

// Verificador periódico — revisa cada 30 segundos si hay un bloqueo programado
// y fuerza logout al vendedor si le toca
function iniciarVerificadorBloqueo(){
  // Verificar cada 15 segundos
  setInterval(async ()=>{
    // Primero sincronizar desde Supabase para recibir cambios de otros dispositivos
    await sincronizarBloqueo();
    if(!SESION) return;
    if(estaBloquedoPara(SESION.rol)){
      toast("🔒 El sistema ha sido bloqueado por el administrador","error");
      setTimeout(()=>logout(), 2000);
    }
  }, 15000); // cada 15 segundos
  // También verificar al volver a tener foco en la ventana/pestaña
  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState==="visible"){
      await sincronizarBloqueo();
      if(SESION && estaBloquedoPara(SESION.rol)){
        toast("🔒 El sistema ha sido bloqueado","error");
        setTimeout(()=>logout(), 2000);
      }
    }
  });
}

// ─────────────────────────────────────────────────────────────
function intentarLogin(){
  const u = document.getElementById("l-user")?.value.trim();
  const p = document.getElementById("l-pass")?.value;
  const err = document.getElementById("login-error");
  if(!u||!p){ if(err)err.style.display="block"; return; }
  // Verificar credenciales primero
  const uObj = USUARIOS.find(x=>x.usuario===u && x.clave===p && x.activo);
  if(!uObj){
    if(err){ err.style.display="block"; err.textContent="Usuario o contraseña incorrectos"; }
    document.getElementById("l-pass").value="";
    document.getElementById("l-pass").focus();
    return;
  }
  // Verificar si el sistema está bloqueado para este rol
  if(estaBloquedoPara(uObj.rol)){
    const b = getBloqueo();
    const msg = b.mensaje || "El sistema no está disponible. Contacte al administrador.";
    if(err){
      err.style.display="block";
      err.innerHTML=`🔒 <strong>Acceso bloqueado</strong><br><span style="font-size:11px">${msg}</span>`;
    }
    document.getElementById("l-pass").value="";
    return;
  }
  // Todo OK — iniciar sesión
  if(login(u,p)){
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("sidebar").style.display      = "";
    document.getElementById("main").style.display         = "";
    if(window.innerWidth<640)
      document.getElementById("bottom-nav").style.display = "block";
    iniciarApp();
  }
}

function ejecutarCambioUsuario(){
  const user = document.getElementById("cu-user")?.value.trim();
  const pass = document.getElementById("cu-pass")?.value;
  const err  = document.getElementById("cu-error");
  if(!user||!pass){ if(err)err.style.display="block"; return; }
  const nuevo = USUARIOS.find(x=>x.usuario===user && x.clave===pass && x.activo);
  if(!nuevo){
    if(err){ err.style.display="block"; err.textContent="✗ Usuario o contraseña incorrectos"; }
    document.getElementById("cu-pass").value="";
    document.getElementById("cu-pass").focus();
    return;
  }
  if(nuevo.id===SESION?.id){
    if(err){ err.style.display="block"; err.textContent="✗ Ya estás conectado como ese usuario"; }
    return;
  }
  SESION = nuevo;
  localStorage.setItem("ibisu_sesion", JSON.stringify({
    id:nuevo.id, nombre:nuevo.nombre, usuario:nuevo.usuario, rol:nuevo.rol
  }));
  closeModal();
  toast(`✓ Sesión cambiada a ${nuevo.nombre}`,"success");
  // Reconfigurar nav según nuevo rol
  const navUsuarios = document.getElementById("nav-usuarios");
  if(navUsuarios) navUsuarios.style.display = esSuperUsuario() ? "" : "none";
  actualizarIndicadorSesion();
  go(document.querySelector('[data-page="dashboard"]'));
}

async function guardarUsuario(id){
  const u=USUARIOS.find(x=>x.id===id);if(!u)return;

  const nuevoNombre  = document.getElementById("eu-nombre")?.value.trim();
  const nuevoUsuario = document.getElementById("eu-usuario")?.value.trim().toLowerCase();
  const nuevaClaveActual = document.getElementById("eu-clave-actual")?.value;
  const nuevaPass    = document.getElementById("eu-pass")?.value;
  const nuevoRol     = document.getElementById("eu-rol")?.value;

  // Validaciones
  if(!nuevoNombre){ toast("El nombre no puede estar vacío","error"); return; }
  if(!nuevoUsuario){ toast("El nombre de usuario no puede estar vacío","error"); return; }

  // Verificar que el nuevo nombre de usuario no lo use otro
  const duplicado = USUARIOS.find(x=>x.usuario===nuevoUsuario && x.id!==id);
  if(duplicado){ toast(`El usuario "${nuevoUsuario}" ya está en uso por ${duplicado.nombre}`,"error"); return; }

  // Determinar qué contraseña guardar
  // Si escribió nueva contraseña → usar esa
  // Si modificó la "contraseña actual" → usar esa
  // Si no tocó nada → mantener la que ya tiene
  let claveAGuardar = u.clave;
  if(nuevaPass && nuevaPass.length>0){
    if(nuevaPass.length<6){ toast("La nueva contraseña debe tener al menos 6 caracteres","error"); return; }
    claveAGuardar = nuevaPass;
  } else if(nuevaClaveActual && nuevaClaveActual !== u.clave){
    if(nuevaClaveActual.length<6){ toast("La contraseña debe tener al menos 6 caracteres","error"); return; }
    claveAGuardar = nuevaClaveActual;
  }

  // Aplicar cambios
  u.nombre  = nuevoNombre;
  u.usuario = nuevoUsuario;
  u.clave   = claveAGuardar;
  u.rol     = nuevoRol;

  // Si es el usuario activo, actualizar sesión
  if(u.id===SESION?.id){
    SESION.nombre  = u.nombre;
    SESION.usuario = u.usuario;
    SESION.rol     = u.rol;
  }

  // Sincronizar con Supabase
  await dbActualizarUsuario(id, {nombre:u.nombre,usuario:u.usuario,clave:u.clave,rol:u.rol});

  closeModal();
  toast(`✓ Usuario "${u.nombre}" actualizado`,"success");
  pgUsuarios();
}

function toggleUsuario(id){
  const u=USUARIOS.find(x=>x.id===id);if(!u||u.id===SESION?.id)return;
  u.activo=!u.activo;
  toast(`Usuario ${u.activo?"activado":"desactivado"}`,"success");
  pgUsuarios();
}

function renderProdGrid(prods){
  return prods.map(p=>`
    <div class="product-card ${p.stock===0?"no-stock":""}" onclick="${p.stock>0?`addCart('${p.codigo}')`:""}" title="${p.stock===0?"Sin stock":"Agregar"}">
      <div class="p-name">${p.nombre}</div>
      <div class="p-price">${fmt(p.precio)}</div>
      <div class="p-stock">${p.stock===0?`<span style='color:var(--red)'>Sin stock</span>`:`Stk: ${p.stock}`}</div>
    </div>`).join("");
}

function filtrarProds(){
  const q=document.getElementById("prod-search")?.value.toLowerCase()||"";
  document.getElementById("product-grid").innerHTML=renderProdGrid(DB.productos.filter(p=>p.nombre.toLowerCase().includes(q)||p.codigo.includes(q)));
}

function addCart(cod){
  const p=DB.productos.find(x=>x.codigo===cod);if(!p||p.stock===0)return;
  const ex=cart.find(i=>i.codigo===cod);
  if(ex){if(ex.cantidad>=p.stock){toast("Sin más stock","error");return;}ex.cantidad++;}
  else cart.push({codigo:cod,nombre:p.nombre,precio:p.precio,cantidad:1});
  renderCart();
  // En móvil, mostrar feedback visual brevísimo
  if(isMobile())toast(`+ ${p.nombre}`,"success");
}

function changeQty(cod,d){
  const it=cart.find(i=>i.codigo===cod);if(!it)return;
  it.cantidad+=d;if(it.cantidad<=0)cart=cart.filter(i=>i.codigo!==cod);
  renderCart();
}
function removeCart(cod){cart=cart.filter(i=>i.codigo!==cod);renderCart();}

function renderCart(){
  const list=document.getElementById("cart-list");
  const empty=document.getElementById("cart-empty");
  const tot=document.getElementById("totals-block");
  if(!list)return;
  list.querySelectorAll(".cart-item").forEach(i=>i.remove());
  updateCartBadge();
  if(cart.length===0){if(empty)empty.style.display="";if(tot)tot.style.display="none";return;}
  if(empty)empty.style.display="none";if(tot)tot.style.display="";
  cart.forEach(it=>{
    const sub=it.precio*it.cantidad;
    const d=document.createElement("div");d.className="cart-item";
    d.innerHTML=`
      <div class="ci-name">${it.nombre}</div>
      <div class="ci-qty">
        <button onclick="changeQty('${it.codigo}',-1)">−</button>
        <span>${it.cantidad}</span>
        <button onclick="changeQty('${it.codigo}',1)">+</button>
      </div>
      <div class="ci-sub">${fmt(sub)}</div>
      <button class="ci-del" onclick="removeCart('${it.codigo}')">${ic('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',14)}</button>`;
    list.appendChild(d);
  });
  // El precio ya incluye ITBIS — descomponer para mostrar
  const total=cart.reduce((a,i)=>a+i.precio*i.cantidad,0);
  const sub  =parseFloat((total/1.18).toFixed(2));
  const itbis=parseFloat((total-sub).toFixed(2));
  document.getElementById("t-sub").textContent=fmt(sub);
  document.getElementById("t-itbis").textContent=fmt(itbis);
  document.getElementById("t-total").textContent=fmt(total);
}

function limpiar(){cart=[];cartCliente="";cartCedula="";cartNCF="B02";invTab="prods";pgFacturacion();}

    ${cartNCF==="B02M"?`
    <div style="background:var(--blue-dim);border:1px solid var(--blue);border-radius:var(--r);padding:10px 13px;margin-bottom:12px">
      <div style="font-size:11px;color:var(--blue);font-family:'DM Mono',monospace;margin-bottom:8px;font-weight:600">✏️ NÚMEROS MANUALES (Consumidor Final Manual)</div>

          <div class="form-label">N° Factura</div>

          <div class="form-label">NCF Comprobante</div>
          <input class="form-input" id="man-ncf-modal" placeholder="Auto (B02...)" style="font-family:'DM Mono',monospace;font-size:12px" maxlength="20"

function toggleEfe(){const g=document.getElementById("efe-grp");if(g)g.style.display=document.getElementById("metodo-pago")?.value==="efectivo"?"":"none";}
function calcVuelto(t){const v=document.getElementById("vuelto-val");if(v)v.textContent=fmt(Math.max(0,(parseFloat(document.getElementById("monto-rec")?.value)||0)-t));}

async function confirmarCobro(cliente,cedula,sub,itbis,total){
  // Determinar número de factura y NCF (manual o automático)
  let num, ncfNum, tipoR;
  if(cartNCF==="B02M"){
    tipoR = "B02";
    // Leer valores manuales del formulario (pueden venir de modal de cobro)
    const numManual = (document.getElementById("man-numfac-modal")||document.getElementById("man-numfac"))?.value?.trim();
    const ncfManual = (document.getElementById("man-ncf-modal")||document.getElementById("man-ncf"))?.value?.trim();
    num    = numManual ? parseInt(numManual) : (1000+(DB.facturas.length+1));
    ncfNum = ncfManual || nextNCF("B02");
  } else {
    tipoR  = cartNCF==="FIADO"?"B02":cartNCF;
    ncfNum = nextNCF(tipoR);
    num    = 1000+(DB.facturas.length+1);
  }
  const hoy=new Date().toLocaleDateString("es-DO",{day:"2-digit",month:"2-digit",year:"numeric"});
  // Leer vendedor: primero del panel (si existe), luego del modal, luego sesión actual
  const vendedorNombre = esAutorizado()
    ? (document.getElementById("sel-vendedor-panel")?.value ||
       document.getElementById("sel-vendedor")?.value ||
       SESION?.nombre || "Sin asignar")
    : (SESION?.nombre || "Sin asignar");
  const esFacturaManual=cartNCF==="B02M";
  const itemsConSubtotal=cart.map(i=>({
    ...i,
    precioFinal: i.precio,
    precioBase:  parseFloat((i.precio/1.18).toFixed(4)),
    subtotal:    parseFloat((i.precio/1.18*i.cantidad).toFixed(2))
  }));
  const facturaObj={
    id:0,numero:num,ncf:ncfNum,tipoNCF:tipoR,
    esManual:esFacturaManual||false,
    cliente,cedula,fecha:hoy,vendedor:vendedorNombre,
    subtotal:sub,itbis,total,items:itemsConSubtotal
  };
  try{
    await dbCrearFactura(facturaObj, itemsConSubtotal);
    if(cartNCF==="FIADO"){
      const cred={id:0,cliente,monto:total,fecha:hoy,pagado:false};
      await dbCrearCredito(cred);
    }
  }catch(e){
    toast("Error guardando factura: "+e.message,"error");
    return;
  }
  closeModal();
  const facturaId = facturaObj.id || DB.facturas.length;
  toast(`✓ ${ncfNum} — ${fmt(total)}`,"success");
  actualizarBadgeFiados();
  cart=[];cartCliente="";cartCedula="";cartNCF="B02";invTab="prods";
  // Preguntar si imprimir
  setTimeout(()=>{
    openModal("✓ Comprobante emitido",`
      <div style="text-align:center;padding:10px 0">
        <div style="font-size:40px;margin-bottom:10px">✅</div>
        <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:4px">${ncfNum}</div>
        <div style="font-size:13px;color:var(--txt3);margin-bottom:4px">${cliente}</div>
        <div style="font-family:'DM Mono',monospace;font-size:22px;color:var(--acc);font-weight:700;margin:12px 0">${fmt(total)}</div>
        <div style="font-size:12px;color:var(--txt3)">¿Deseas imprimir el ticket ahora?</div>
      </div>`,
      `<button class="btn btn-ghost" onclick="closeModal();pgFacturacion()">Omitir</button>
       <button class="btn btn-primary" onclick="closeModal();pgFacturacion();setTimeout(()=>modalImpresora(${facturaId}),100)">
         ${ic('<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>')} Imprimir ticket
       </button>`);
  }, 300);
}

    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;font-size:13px">

function recalcItemFact(factId, itemIdx){
  const f=DB.facturas.find(x=>x.id===factId);if(!f)return;
  const cant=parseInt(document.getElementById("ef-cant-"+itemIdx)?.value)||1;
  const sub=cant*f.items[itemIdx].precio;
  const el=document.getElementById("ef-sub-"+itemIdx);
  if(el)el.textContent=fmt(sub);
}

async function guardarEdicionFactura(id){
  if(!esAutorizado()){toast("Acceso denegado","error");return;}
  const f=DB.facturas.find(x=>x.id===id);if(!f)return;
  const esSU=esSuperUsuario();
  // Campos disponibles para todos los autorizados
  f.cliente  = document.getElementById("ef-cliente")?.value.trim()||f.cliente;
  f.cedula   = document.getElementById("ef-cedula")?.value.trim()||"";
  f.vendedor = document.getElementById("ef-vendedor")?.value||f.vendedor;
  // Campos exclusivos del superusuario
  if(esSU){
    f.numero = parseInt(document.getElementById("ef-num")?.value)||f.numero;
    f.ncf    = document.getElementById("ef-ncf")?.value.trim()||f.ncf;
    f.fecha  = document.getElementById("ef-fecha")?.value.trim()||f.fecha;
    f.tipoNCF= document.getElementById("ef-tipo")?.value||f.tipoNCF;
    // Cantidades de items
    f.items.forEach((it,i)=>{
      const cant=parseInt(document.getElementById("ef-cant-"+i)?.value)||it.cantidad;
      it.cantidad=cant;
      const pFinal=it.precioFinal||it.precio;
      const pBase =parseFloat((pFinal/1.18).toFixed(4));
      it.precioFinal=pFinal;
      it.precioBase=pBase;
      it.subtotal=parseFloat((pBase*cant).toFixed(2));
    });
    // Recalcular totales
    f.total=f.items.reduce((a,i)=>a+(it=>it.precioFinal||it.precio)(i)*i.cantidad,0);
    f.total=parseFloat(f.total.toFixed(2));
    f.subtotal=parseFloat((f.total/1.18).toFixed(2));
    f.itbis=parseFloat((f.total-f.subtotal).toFixed(2));
  }
  await dbActualizarFactura(id, f, f.items);
  closeModal();
  toast(`✓ Factura ${f.ncf||"#"+f.numero} actualizada`,"success");
  pgFacturas();
}

  const vecesVendido=DB.facturas.reduce((a,f)=>a+f.items.filter(i=>i.nombre===p.nombre).length,0);
  openModal(`🗑 Eliminar producto`,`
    <div style="text-align:center;padding:10px 0 6px">

async function confirmarEliminarProd(cod){
  if(!esSuperUsuario()){toast("Acceso denegado","error");return;}
  const p=DB.productos.find(x=>x.codigo===cod);
  if(!p){toast("Producto no encontrado","error");return;}
  const nombre=p.nombre;
  await dbEliminarProducto(cod);
  closeModal();
  toast(`🗑 "${nombre}" eliminado del inventario`,"success");
  pgInventario();
}

function exportar606(){

  const blob=new Blob([[hdr,...rows].join("\n")],{type:"text/csv;charset=utf-8;"});
