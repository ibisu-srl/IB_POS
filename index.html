  const autoSel = modo==="pdf"
    ? 0
    : Math.max(1, todasOpciones.findIndex((x,i)=>i>0&&(x.preferida||(i===1&&!preferida))));

  const opcionesHTML = todasOpciones.map((imp,i)=>{
    const sel = i===autoSel;
    const esPDF = imp.esPDF;
    const color = esPDF?"var(--red)":sel?"var(--acc)":"var(--line2)";
    const bgSel = esPDF&&sel?"var(--red-dim)":sel?"var(--acc-dim)":"var(--bg3)";
    return `
    <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;
                border:1.5px solid ${sel?color:"var(--line2)"};border-radius:var(--r);
                cursor:pointer;margin-bottom:8px;background:${sel?bgSel:"var(--bg3)"};transition:all .15s"
         id="cfg-opt-${i}" onclick="selectImpresoraCfg(${i},${todasOpciones.length})">
      <input type="radio" name="cfg-radio" value="${imp.nombre}" style="display:none" ${sel?"checked":""}>
      <div style="width:40px;height:40px;border-radius:10px;background:${esPDF?"var(--red-dim)":"var(--bg4)"};
                  border:1.5px solid ${esPDF?"rgba(224,82,82,.3)":"var(--line)"};
                  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">
        ${esPDF?"📄":"🖨"}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:${esPDF?"var(--red)":"var(--txt)"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${esPDF?"PDF / Vista previa":imp.nombre}
        </div>
        <div style="font-size:11px;color:var(--txt3);margin-top:1px">${imp.descripcion}</div>
        <div style="display:flex;gap:5px;margin-top:4px;flex-wrap:wrap">
          ${esPDF?`<span class="badge" style="background:var(--red-dim);color:var(--red);font-size:9.5px">PDF</span>
                   <span class="badge" style="background:var(--blue-dim);color:var(--blue);font-size:9.5px">Preview</span>`:""}
          ${!esPDF&&imp.predeterminada?'<span class="badge badge-blue" style="font-size:9.5px">Del sistema</span>':""}
          ${!esPDF&&imp.preferida?'<span class="badge badge-green" style="font-size:9.5px">★ Preferida</span>':""}
        </div>
      </div>
      <div id="cfg-chk-${i}" style="width:22px;height:22px;border-radius:50%;flex-shrink:0;
                                     border:2px solid ${sel?color:"var(--line2)"};
                                     display:flex;align-items:center;justify-content:center;transition:all .15s">
        ${sel?`<div style="width:10px;height:10px;border-radius:50%;background:${color}"></div>`:""}
      </div>
    </div>`;}).join("");

  openModal("⚙ Configurar impresora / PDF",`
    <p style="font-size:13px;color:var(--txt3);margin-bottom:14px">
      Elige la impresora física o el modo PDF que se usará por defecto.

    <div id="cfg-ancho-wrap" style="background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px;transition:opacity .2s;${modo==="pdf"?"opacity:.5;pointer-events:none":""}">

                      background:${ancho===o.a?"var(--acc-dim)":"var(--bg4)"}">
            <div style="font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:${ancho===o.a?"var(--acc)":"var(--txt)"}">${o.a}ch</div>
            <div style="font-size:11px;font-weight:600;color:${ancho===o.a?"var(--acc)":"var(--txt2)"};">${o.l}</div>
            <div style="font-size:10px;color:var(--txt3)">${o.s}</div>

      💡 Usa <strong>Probar</strong> para verificar cómo queda el ticket.
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-ghost" onclick="probarImpresion()">Probar</button>
     <button class="btn btn-primary" onclick="guardarConfigImpresora()">
       ${ic('<polyline points="20 6 9 17 4 12"/>')} Guardar
     </button>`);
  window._impresorasModal = todasOpciones;
  window._anchoSeleccionado = ancho;
}

function selectImpresoraCfg(idx, total){
  const opts = window._impresorasModal||[];
  for(let i=0;i<total;i++){
    const el=document.getElementById(`cfg-opt-${i}`);
    const chk=document.getElementById(`cfg-chk-${i}`);
    const esPDF=opts[i]?.esPDF;
    const sel=i===idx;
    const color=esPDF?"var(--red)":sel?"var(--acc)":"var(--line2)";
    const bgSel=esPDF&&sel?"var(--red-dim)":sel?"var(--acc-dim)":"var(--bg3)";
    if(el){el.style.borderColor=sel?color:"var(--line2)";el.style.background=sel?bgSel:"var(--bg3)";}
    if(chk){chk.style.borderColor=sel?color:"var(--line2)";chk.innerHTML=sel?`<div style="width:10px;height:10px;border-radius:50%;background:${color}"></div>`:"";}
    const r=el?.querySelector("input[type=radio]");if(r)r.checked=sel;
  }
  const aw=document.getElementById("cfg-ancho-wrap");
  if(aw){aw.style.opacity=opts[idx]?.esPDF?"0.5":"1";aw.style.pointerEvents=opts[idx]?.esPDF?"none":"auto";}
}

function selectAnchoCfg(ancho){
  [32,42,48].forEach(a=>{
    const el=document.getElementById(`cfg-ancho-${a}`);if(!el)return;
    const s=a===ancho;
    el.style.borderColor=s?"var(--acc)":"var(--line2)";
    el.style.background=s?"var(--acc-dim)":"var(--bg4)";
    el.querySelectorAll("div")[0].style.color=s?"var(--acc)":"var(--txt)";
  });
  window._anchoSeleccionado=ancho;
}

function guardarConfigImpresora(){
  const radio=document.querySelector("input[name=cfg-radio]:checked");
  const imp=radio?radio.value:"";
  const ancho=window._anchoSeleccionado||getAnchoTicket();
  if(imp==="__PDF__"){ setModoImpresion("pdf"); }
  else{ setModoImpresion("impresora"); if(imp)setImpresoraPreferida(imp); }
  setAnchoTicket(ancho);
  closeModal();
  const label=imp==="__PDF__"?"PDF / Vista previa":imp||"predeterminada";
  toast(`✓ Configuración guardada: ${label}`,"success");
}

async function probarImpresion(){
  const radio=document.querySelector("input[name=cfg-radio]:checked");
  const imp=radio?radio.value:getImpresoraPreferida();
  const ancho=window._anchoSeleccionado||getAnchoTicket();
  const factPrueba={
    id:0,numero:"PRUEBA",ncf:"B020000000000",tipoNCF:"B02",
    cliente:"Cliente de Prueba",cedula:"",
    fecha:new Date().toLocaleDateString("es-DO",{day:"2-digit",month:"2-digit",year:"numeric"}),
    subtotal:84.75,itbis:15.25,total:100.00,
    items:[{nombre:"Producto de muestra",cantidad:1,precio:84.75,subtotal:84.75}]
  };
  if(imp==="__PDF__"||imp===""){
    abrirPreviewTicket(null,factPrueba,ancho,imp==="__PDF__");
    return;
  }
  try{
    const r=await fetch("/api/imprimir",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({factura_id:null,impresora:imp,ancho,texto_prueba:"PRUEBA"})});
    const d=await r.json();
    if(d.preview)abrirPreviewTicket(d.preview,factPrueba,ancho,false);
    else toast("🖨 Ticket de prueba enviado a "+imp,"success");
  }catch{abrirPreviewTicket(null,factPrueba,ancho,false);}
}

function modalArticuloLibre(){
  // Paso 1: verificar si el usuario actual ya es superusuario
  if(esSuperUsuario()){
    _mostrarFormArticuloLibre();
    return;
  }
  // Paso 2: pedir contraseña de superusuario
  openModal("🔐 Autorización requerida",`
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:36px;margin-bottom:8px">🔐</div>
      <div style="font-size:14px;font-weight:600;color:var(--txt)">Artículo libre</div>
      <div style="font-size:12px;color:var(--txt3);margin-top:4px">
        Para facturar artículos no registrados se requiere<br>autorización de un superusuario.
      </div>
    </div>
    <div class="form-group">
      <div class="form-label">Usuario superusuario</div>
      <input class="form-input" id="al-user" placeholder="Usuario" autocapitalize="none"
             onkeydown="if(event.key==='Enter')document.getElementById('al-pass').focus()">
    </div>
    <div class="form-group">
      <div class="form-label">Contraseña</div>
      <input class="form-input" id="al-pass" type="password" placeholder="Contraseña"
             onkeydown="if(event.key==='Enter')_verificarAutoLibre()">
    </div>
    <div id="al-error" style="display:none;color:var(--red);font-size:12px;margin-top:-8px;padding:6px 0">
      ✗ Credenciales incorrectas o sin permisos de superusuario
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="_verificarAutoLibre()">
       Verificar y continuar
     </button>`);
  setTimeout(()=>document.getElementById("al-user")?.focus(),200);
}

function _verificarAutoLibre(){
  const usuario = document.getElementById("al-user")?.value.trim();
  const clave   = document.getElementById("al-pass")?.value;
  const err     = document.getElementById("al-error");
  // Buscar el usuario y verificar que sea superusuario
  const u = USUARIOS.find(x=>x.usuario===usuario && x.clave===clave && x.activo && x.rol==="superusuario");
  if(!u){
    if(err) err.style.display="block";
    document.getElementById("al-pass").value="";
    document.getElementById("al-pass").focus();
    return;
  }
  // Autorizado — mostrar formulario de artículo
  closeModal();
  setTimeout(_mostrarFormArticuloLibre, 200);
}

function _mostrarFormArticuloLibre(){
  openModal("➕ Artículo libre",`
    <div style="background:var(--orange-dim);border:1px solid var(--orange);border-radius:var(--r);padding:10px 13px;margin-bottom:16px;font-size:12px;color:var(--orange)">
      ⚠ Este artículo <strong>no quedará registrado en el inventario</strong>. Solo aparecerá en esta factura.
    </div>
    <div class="form-group">
      <div class="form-label">Nombre del artículo *</div>
      <input class="form-input" id="alib-nombre" placeholder="Descripción del producto o servicio"
             onkeydown="if(event.key==='Enter')document.getElementById('alib-precio').focus()">
    </div>
    <div class="form-row">
      <div class="form-group">
        <div class="form-label">Precio unitario (RD$) *</div>
        <input class="form-input" type="number" inputmode="decimal" id="alib-precio"
               placeholder="0.00" min="0" step="0.01"
               onkeydown="if(event.key==='Enter')document.getElementById('alib-cant').focus()">
      </div>
      <div class="form-group">
        <div class="form-label">Cantidad *</div>
        <input class="form-input" type="number" inputmode="numeric" id="alib-cant"
               placeholder="1" min="1" value="1"
               onkeydown="if(event.key==='Enter')_agregarArticuloLibre()">
      </div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="_agregarArticuloLibre()">
       <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
       Agregar a factura
     </button>`);
  setTimeout(()=>document.getElementById("alib-nombre")?.focus(),200);
}

function _agregarArticuloLibre(){
  const nombre = document.getElementById("alib-nombre")?.value.trim();
  const precio = parseFloat(document.getElementById("alib-precio")?.value)||0;
  const cant   = parseInt(document.getElementById("alib-cant")?.value)||1;

  if(!nombre){ toast("Ingresa el nombre del artículo","error"); return; }
  if(precio<=0){ toast("El precio debe ser mayor a cero","error"); return; }
  if(cant<1){ toast("La cantidad debe ser al menos 1","error"); return; }

  // Agregar al carrito con código especial "LIBRE-xxx"
  const id = "LIBRE-"+Date.now();
  // El precio ingresado en artículo libre es también precio final con ITBIS
  cart.push({
    codigo:     id,
    nombre:     nombre,
    precio:     precio,       // precio final con ITBIS incluido
    precioFinal:precio,
    precioBase: parseFloat((precio/1.18).toFixed(4)),
    cantidad:   cant,
    esLibre:    true
  });
  closeModal();
  toast(`✓ "${nombre}" agregado a la factura`,"success");
  renderCart();
  // Si estamos en móvil con tabs, cambiar al tab del carrito
  if(invTab==="prods"){
    const tabs=document.querySelectorAll(".inv-tab");
    if(tabs.length>=2) switchInvTab("carrito",tabs[1]);
  }
}

async function iniciarApp(){
  // Mostrar/ocultar elementos según rol
  const navUsuarios = document.getElementById("nav-usuarios");
  if(navUsuarios) navUsuarios.style.display = esSuperUsuario() ? "" : "none";

  // Verificar conexión Supabase y cargar datos
  const conectado = await verificarConexionSupabase();
  if(conectado){
    // Mostrar indicador de carga
    document.getElementById("content").innerHTML=`
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:14px;color:var(--txt3)">
        <div style="width:36px;height:36px;border:3px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite"></div>
        <div style="font-size:13px">Cargando datos desde la nube...</div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
    // Cargar todos los datos en paralelo
    await Promise.all([
      dbGetProductos(),
      dbGetFacturas(),
      dbGetCreditos(),
      dbGetUsuarios()
    ]);
    toast("✓ Datos cargados desde Supabase","success");
  } else if(SUPABASE_URL !== "PEGAR_URL_AQUI"){
    toast("⚠ Sin conexión — modo local temporal","info");
  }

  // Sincronizar bloqueo desde Supabase antes de mostrar la app
  await sincronizarBloqueo();
  pgDashboard();
  actualizarIndicadorSesion();
  actualizarBadgeFiados();
  iniciarVerificadorBloqueo(); // verifica bloqueo programado cada 15 segundos
}

// Badge de fiados en bottom nav
function actualizarBadgeFiados(){
  const n=DB.creditos.filter(c=>!c.pagado).length;
  const b=document.getElementById("bnav-mas-badge");
  if(b){b.textContent=n;b.style.display=n>0?"block":"none";}
}

// Cerrar sidebar al hacer resize a desktop
window.addEventListener("resize",()=>{
  if(window.innerWidth>=1024)closeSidebar();
});

// ── Swipe horizontal entre tabs de facturación ──────
let swipeX0=null;
document.addEventListener("touchstart",e=>{
  const layout=document.querySelector(".invoice-layout");
  if(!layout)return;
  swipeX0=e.touches[0].clientX;
},{passive:true});
document.addEventListener("touchend",e=>{
  const layout=document.querySelector(".invoice-layout");
  if(!layout||swipeX0===null)return;
  const dx=e.changedTouches[0].clientX-swipeX0;
  swipeX0=null;
  if(Math.abs(dx)<60)return;
  const tabs=document.querySelectorAll(".inv-tab");
  if(!tabs.length)return;
  if(dx<0&&invTab==="prods")switchInvTab("carrito",tabs[1]);
  else if(dx>0&&invTab==="carrito")switchInvTab("prods",tabs[0]);
},{passive:true});

// ── Arranque: intentar restaurar sesión o mostrar login ─
if(restaurarSesion()){
  iniciarApp();
} else {
  mostrarLogin();
}

// ═══════════════════════════════════════════════════
// SERVICE WORKER — funciona offline al recargar
// ═══════════════════════════════════════════════════
if('serviceWorker' in navigator){
  // Crear el Service Worker como Blob para no necesitar archivo externo
  const swCode = `
const CACHE_NAME = 'ibisu-pos-v1';

// Al instalar: guardar el propio HTML en caché
self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME).then(cache => {
      return cache.addAll([self.location.origin + self.location.pathname]);
    }).then(() => self.skipWaiting())
  );
});

// Al activar: limpiar cachés viejas
self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
    ).then(() => self.clients.claim())
  );
});

// Al hacer fetch: servir desde caché si no hay internet
self.addEventListener('fetch', event => {
  // Solo interceptar peticiones GET
  if(event.request.method !== 'GET') return;

  // Para peticiones a Supabase: intentar red primero, si falla ignorar
  if(event.request.url.includes('supabase.co')){
    event.respondWith(
      fetch(event.request).catch(() =>
        new Response(JSON.stringify([]), {
          headers: {'Content-Type':'application/json'}
        })
      )
    );
    return;
  }

  // Para el HTML del sistema: caché primero, luego red
  event.respondWith(
    caches.match(event.request).then(cached => {
      if(cached) return cached;
      return fetch(event.request).then(response => {
        // Guardar en caché si es válido
        if(response && response.status === 200){
          const clone = response.clone();
          caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));
        }
        return response;
      }).catch(() => cached);
    })
  );
});
`;

  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swURL  = URL.createObjectURL(swBlob);

  navigator.serviceWorker.register(swURL, {scope: '/'})
    .then(reg => {
      console.log('✓ Service Worker registrado — sistema disponible offline');
      // Revisar actualizaciones cada vez que se abre
      reg.update();
    })
    .catch(err => {
      // En algunos browsers el Blob SW no está permitido — no es crítico
      console.log('Service Worker no disponible en este browser:', err.message);
    });
}
</script>
